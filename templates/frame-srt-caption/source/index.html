<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280,height=720,initial-scale=1" />
<title>Timed SRT Captions</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; }
  body {
    position: relative;
    color: #f7f7f5;
    background: #0d0f14;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", Arial, sans-serif;
    border: 0;
  }
  .ambient, .ambient::before, .ambient::after { position: absolute; inset: 0; content: ""; }
  .ambient { background: radial-gradient(circle at 20% 20%, #23324b 0, transparent 42%), linear-gradient(135deg, #0d0f14, #151926); }
  .ambient::before { opacity: .32; background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.08) 50%, transparent 80%); transform: translateX(-40%); }
  .ambient::after { opacity: .22; background-image: radial-gradient(rgba(255,255,255,.7) .6px, transparent .7px); background-size: 5px 5px; }
  body[data-theme="light"] { color: #11151d; background: #eceee9; }
  body[data-theme="light"] .ambient { background: linear-gradient(135deg, #f3f4ef, #dce4ee); }
  body[data-theme="warm"] { color: #211b16; background: #eadcc7; }
  body[data-theme="warm"] .ambient { background: radial-gradient(circle at 72% 24%, #f5b971 0, transparent 30%), linear-gradient(145deg, #f3eadc, #d7b896); }
  body[data-theme="electric"] .ambient { background: radial-gradient(circle at 75% 25%, #864cff 0, transparent 32%), radial-gradient(circle at 20% 78%, #00d4ff 0, transparent 34%), #0a0820; }
  body[data-theme="cinema"] .ambient { background: radial-gradient(circle at 15% 28%, rgba(255,116,63,.58), transparent 24%), linear-gradient(135deg, #120b0a, #241c18 60%, #080808); }
  .stage { position: absolute; inset: 0; overflow: hidden; }
  .scene { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 80px; pointer-events: none; }
  .scene.active { display: flex; }
  .caption {
    max-width: 1026px; padding: 28px 39px 31px; border-radius: 19px;
    background: rgba(8, 10, 16, .74); color: #fff;
    box-shadow: 0 23px 67px rgba(0,0,0,.28); backdrop-filter: blur(12px);
    font-size: 55px; line-height: 1.28; font-weight: 750; letter-spacing: -.025em;
    text-align: center; white-space: pre-wrap; overflow-wrap: anywhere;
    opacity: 0;
  }
  .caption.medium { font-size: 45px; }
  .caption.long { font-size: 36px; line-height: 1.34; }
  .scene[data-layout="lower-third"] { align-items: flex-end; padding-bottom: 70px; }
  .scene[data-layout="lower-third"] .caption { font-size: 40px; max-width: 1106px; padding: 20px 32px 23px; }
  .scene[data-layout="split-left"] { justify-content: flex-start; }
  .scene[data-layout="split-right"] { justify-content: flex-end; }
  .scene[data-layout^="split-"] .caption { width: 706px; text-align: left; border-radius: 7px; border-left: 8px solid #ff7043; }
  .scene[data-template="frame-swiss-grid"] .caption { border-radius: 0; background: rgba(246,247,242,.92); color: #11151d; border: 2px solid currentColor; box-shadow: 12px 12px 0 rgba(17,21,29,.18); }
  .scene[data-template="frame-kinetic-type"] .caption { background: transparent; box-shadow: none; text-transform: none; font-weight: 900; text-shadow: 0 8px 38px rgba(0,0,0,.36); }
  .scene[data-template="frame-warm-grain"] .caption { background: rgba(255,249,238,.84); color: #271d15; box-shadow: none; }
  .scene[data-template="frame-light-leak-cinema"] .caption { background: linear-gradient(90deg, rgba(0,0,0,.78), rgba(0,0,0,.34)); border-radius: 4px; }
  .scene[data-template="frame-bold-signal"] .caption { background: #ff5a36; color: #171717; border-radius: 23px 3px 3px 23px; font-weight: 900; }
  mark { color: inherit; background: linear-gradient(transparent 67%, #ffd54f 67%); padding: 0 .04em; }
  .scene.active[data-animation="fade-up"] .caption { animation: fadeUp .46s cubic-bezier(.2,.8,.2,1) both; }
  .scene.active[data-animation="scale-in"] .caption { animation: scaleIn .42s cubic-bezier(.16,1,.3,1) both; }
  .scene.active[data-animation="wipe"] .caption { animation: wipeIn .52s cubic-bezier(.2,.8,.2,1) both; }
  .scene.active[data-animation="type-focus"] .caption { animation: focusIn .5s ease-out both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(42px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes scaleIn { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: scale(1); } }
  @keyframes wipeIn { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0); } }
  @keyframes focusIn { from { opacity: 0; filter: blur(16px); letter-spacing: .08em; } to { opacity: 1; filter: blur(0); letter-spacing: -.025em; } }
</style>
</head>
<body data-theme="dark">
  <div class="ambient"></div>
  <main class="stage" id="stage"></main>
<script>
(() => {
  const injected = '__HV_BATCH_DATA__';
  const sample = {
    cues: [{ index: 1, startMs: 0, endMs: 5000, text: '让字幕跟声音\n准确地一起呼吸。' }],
    directions: [{ cueIndex: 1, templateId: 'frame-swiss-grid', layout: 'center', theme: 'light', animation: 'fade-up', emphasis: ['准确'] }]
  };
  const data = typeof injected === 'string' ? sample : injected;
  const directionByCue = new Map(data.directions.map(item => [item.cueIndex, item]));
  const stage = document.getElementById('stage');
  let startedAt = 0;
  let running = false;

  function addHighlightedText(target, text, emphasis) {
    let cursor = 0;
    const words = (emphasis || []).filter(Boolean);
    while (cursor < text.length) {
      let nextIndex = -1;
      let nextWord = '';
      for (const word of words) {
        const index = text.indexOf(word, cursor);
        if (index >= 0 && (nextIndex < 0 || index < nextIndex)) { nextIndex = index; nextWord = word; }
      }
      if (nextIndex < 0) { target.append(document.createTextNode(text.slice(cursor))); break; }
      if (nextIndex > cursor) target.append(document.createTextNode(text.slice(cursor, nextIndex)));
      const mark = document.createElement('mark');
      mark.textContent = nextWord;
      target.append(mark);
      cursor = nextIndex + nextWord.length;
    }
  }

  const scenes = data.cues.map(cue => {
    const direction = directionByCue.get(cue.index) || { templateId: 'frame-swiss-grid', layout: 'center', theme: 'light', animation: 'fade-up', emphasis: [] };
    const scene = document.createElement('section');
    scene.className = 'scene';
    scene.dataset.layout = direction.layout;
    scene.dataset.animation = direction.animation;
    scene.dataset.template = direction.templateId;
    scene.dataset.theme = direction.theme;
    const caption = document.createElement('div');
    caption.className = 'caption' + (cue.text.length > 72 ? ' long' : cue.text.length > 42 ? ' medium' : '');
    addHighlightedText(caption, cue.text, direction.emphasis);
    scene.append(caption);
    stage.append(scene);
    return { cue, scene, direction, active: false };
  });

  function tick(now) {
    if (!running) return;
    const elapsed = Math.max(0, now - startedAt);
    let activeTheme = 'dark';
    for (const item of scenes) {
      const active = elapsed >= item.cue.startMs && elapsed < item.cue.endMs;
      if (active !== item.active) {
        item.active = active;
        item.scene.classList.toggle('active', active);
      }
      if (active) activeTheme = item.direction.theme;
    }
    document.body.dataset.theme = activeTheme;
    requestAnimationFrame(tick);
  }

  window.__hvPlayAll = () => {
    running = true;
    startedAt = performance.now();
    requestAnimationFrame(tick);
  };
  if (typeof injected === 'string') setTimeout(window.__hvPlayAll, 120);
})();
</script>
</body>
</html>
